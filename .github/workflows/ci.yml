name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  devcontainer:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build Dev Container
        run: docker build --tag kilo-code-opencode-provider-devcontainer .devcontainer
      # TODO: Pass a KILO_CODE_API_KEY secret here to run live completions once Kilo supports scoped API keys.
      - name: Verify baked OpenCode CLIs
        run: docker run --rm --volume "$PWD:/workspace" --workdir /workspace kilo-code-opencode-provider-devcontainer /workspace/.devcontainer/test.sh
